[project]
name = "pokegrab"
version = "0.1.0"
description = "Notify Discord when Pokemon card products restock at retail."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
playwright = ["playwright>=1.40", "playwright-stealth<2.0"]

[project.scripts]
pokegrab = "pokegrab.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pokegrab*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle errors/warnings, pyflakes, isort

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
