[project]
name = "pokegrab"
version = "0.1.0"
description = "Notify Discord when Pokemon card products restock at retail."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pokegrab = "pokegrab.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pokegrab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
