# Seconds between scans of each store. Values under 60 are raised to 60.
poll_seconds: 60

# Per-store overrides of poll_seconds. eBay allows about 5,000 API calls a day
# and each scan makes one call per keyword and extra search; page stores block
# frequent visitors.
store_poll_seconds:
  ebay: 240
  pokemoncenter: 180
  target: 90
  walmart: 90
  dollargeneral: 180

# Skip cheap accessories. Omit price_max to allow any higher price.
price_min: 10

keywords:
  - elite trainer box
  - booster bundle
  - booster box
  - ultra premium collection
  - collection box
  - tin

exclude:
  - plush
  - shirt
  - hoodie
  - hat
  - funko
  - puzzle
  - poster

stores:
  bestbuy: false    # disabled — no API key
  amazon: false     # disabled — no API key
  pokemoncenter: true
  target: true
  walmart: true
  ebay: true
  dollargeneral: true

database: data/state.db

# Dollar General shelf counts at specific stores. Ignores the keywords and
# price_min above, since its Pokemon stock is mostly packs and tins under $10.
# Store numbers are the last part of the store's page URL in the store directory,
# e.g. dollargeneral.com/store-directory/ca/stockton/13585.
dollargeneral:
  search: pokemon
  # A Pokemon item must also contain one of these, which skips candy and toys.
  include: [trading card, tcg, booster, card pack, tin]
  stores:
    13585: 4115 N El Dorado St, Stockton
    13592: 4232 E Main St, Stockton
    13593: 2150 W Alpine Ave, Stockton
    13632: 2907 E Waterloo Rd, Stockton
    25626: 310 W Dr Martin Luther King Jr Blvd, Stockton

# After a product is posted, skip repeat alerts for it for this many hours,
# even if it restocks or is relisted. 0 turns the cooldown off.
alert_cooldown_hours: 6

# eBay posts Pokemon listings whose price plus shipping is at or slightly above
# MSRP. A listing whose title matches none of the msrp entries is ignored.
ebay:
  # 15 allows a $49.99 ETB up to $57.49 shipped.
  max_markup_percent: 15
  # Skip listings under this share of MSRP. Those are almost always a single
  # accessory (dice, playmat, sleeves) sold out of the box the title names.
  min_percent_of_msrp: 60
  # US MSRP by product type (checked Oct 2026). The longest matching phrase
  # wins, so "knock out collection" beats the generic "collection box".
  msrp:
    pokemon center elite trainer box: 59.99
    elite trainer box: 49.99
    booster bundle: 26.94                # 6 packs at $4.49
    booster box: 161.64                  # 36 packs at $4.49
    ultra premium collection: 179.99     # older 16-18 pack UPCs were $119.99
    super premium collection: 89.99      # Charizard ex $79.99, Prismatic Evolutions $89.99
    premium collection: 39.99            # some run up to $59.99
    binder collection: 31.99
    figure collection: 29.99
    poster collection: 14.99
    tech sticker collection: 14.99
    knock out collection: 9.99
    knockout collection: 9.99
    ex box: 21.99
    build & battle box: 21.99
    build and battle box: 21.99
    battle deck: 19.99
    3 pack blister: 13.99
    2 pack blister: 9.99
    collection box: 29.99                # fallback for collections not listed above
    ex tin: 21.99
    mini tin: 9.99
    tin: 26.99
  # Asian-language prints. A title with one of the words uses that table
  # instead of the US one, and is skipped if its product type is not listed.
  # Prices are home retail converted to dollars (Oct 2026: 158 yen, 1,334 won
  # per dollar). The higher markup leaves room for shipping from Asia.
  editions:
    japanese:
      words: [japanese, japan, jpn, jp]
      max_markup_percent: 60
      msrp:
        30th celebration booster box: 45.57   # 7,200 yen, 20 packs
        premium trainer box: 40.19            # 6,350 yen
        booster box: 37.97                    # 6,000 yen, 30 packs (5,400 for sets before May 2026)
        high class pack: 34.81                # 5,500 yen box, 10 packs
        special card set: 12.53               # 1,980 yen
        starter set: 11.39                    # 1,800 yen
    korean:
      words: [korean, korea, kor, kr]
      max_markup_percent: 60
      msrp:
        high class pack: 37.48                # 50,000 won box
        booster box: 22.49                    # 30,000 won
    chinese:
      words: [chinese]
      # Already a US import-shop price, so it gets the normal markup.
      max_markup_percent: 15
      msrp:
        30th celebration booster box: 129.99  # Simplified Chinese, 20 packs
  # Searched on eBay only, on top of the keywords above.
  extra_searches:
    - japanese booster box
    - high class pack
    - premium trainer box
    - korean booster box
    - chinese booster box
  exclude:
    - empty
    - opened
    - box only
    - no packs
    - lot
    - case
    - proxy
    - custom
    - repack
    - damaged
    # Accessories sold separately from the box they came in
    - playmat
    - play mat
    - dice
    - sleeves
    - divider
    - dividers
    - energy cards
    - coin
    - damage counters
    - player's guide
    - storage box
    - deck box
    - no cards
    - no boosters
    - promo only
    - card only
    - dice only
